name: Verify official data sources

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: verified-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MANYFOLDS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check official source changes
        if: env.DATABASE_URL != ''
        run: npm run data:sources:check:apply
      - name: Recheck reviewed academic programme facts independently
        if: always() && env.DATABASE_URL != ''
        run: node scripts/reverify-official-pilot.mjs --apply
      - name: Recheck reviewed vocational qualification rows
        if: always() && env.DATABASE_URL != ''
        run: node scripts/import-dgt-cts.mjs --apply
      - name: Recheck reviewed domestic NLSIU admission rules
        if: always() && env.DATABASE_URL != ''
        run: node scripts/import-nlsiu-ba.mjs --apply
      - name: Stage current NSP cards for review
        if: always() && env.DATABASE_URL != ''
        run: npm run data:scholarships:stage:apply
      - name: Publish unchanged reviewed NSP cards
        if: always() && env.DATABASE_URL != ''
        run: node scripts/publish-reviewed-nsp-listings.mjs --apply
      - name: Report coverage even when a publisher requires review
        if: always() && env.DATABASE_URL != ''
        run: npm run data:verified:coverage
      - name: Explain missing database connection
        if: env.DATABASE_URL == ''
        run: echo 'Set the MANYFOLDS_DATABASE_URL repository secret to enable the scheduled source refresh.'
